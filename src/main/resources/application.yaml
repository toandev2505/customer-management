server:
  port: 8081

spring:
  application:
    name: customer
  datasource:
    url: jdbc:mysql://localhost:3306/customer_management
    username: root
    password:
  security:
    user:
      name: admin
      password: 123456
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    view-names: login, register

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        enable_lazy_load_no_trans: true
        format_sql: true